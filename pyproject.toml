[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsdviztools3"
version = "0.4.0"
description = "PyGMT-based visualisation tools for LSDTopoTools v3 (lsdtt3) output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Simon M. Mudd", email = "simon.m.mudd@ed.ac.uk" },
    { name = "Rutger Vervoordeldonk" },
]
keywords = ["geomorphology", "topography", "pygmt", "gmt", "lsdtopotools", "dem"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # pip installs PyGMT but not the GMT C library it wraps, which comes from
    # conda-forge / pixi, Homebrew or the system. Without it the map renderers
    # raise lsdviztools3._gmt.GMTNotAvailableError; the charts still work.
    "pygmt",
    "rioxarray",
    "xarray",
    "geopandas",
    "pandas",
    "numpy",
    "pillow",  # GIF assembly for transient-run animations (render.animation)
    "matplotlib",  # x-y charts (charts.*), used by many lsdviz3-* commands, and matplotlib colour maps
]

[project.urls]
Homepage = "https://lsdtopotools.github.io/lsdviztools3/"
Documentation = "https://lsdtopotools.github.io/lsdviztools3/"
Repository = "https://github.com/LSDtopotools/lsdviztools3"
Issues = "https://github.com/LSDtopotools/lsdviztools3/issues"
"lsdtt3 documentation" = "https://lsdtopotools.github.io/lsdtt3/"
"lsdtt3 repository" = "https://github.com/LSDtopotools/lsdtt3"

[project.optional-dependencies]
download = ["requests", "planetary-computer", "pystac-client"]
# Kept so `pip install lsdviztools3[charts]` still works; matplotlib is now a
# core dependency.
charts = []
test = ["pytest"]

[project.scripts]
lsdviz3-hillshade = "lsdviztools3.cli.plot_hillshade:main"
lsdviz3-drape = "lsdviztools3.cli.plot_drape:main"
lsdviz3-channels = "lsdviztools3.cli.plot_channels:main"
lsdviz3-basins = "lsdviztools3.cli.plot_basins:main"
lsdviz3-divide-migration = "lsdviztools3.cli.plot_divide_migration:main"
lsdviz3-cosmo-basins = "lsdviztools3.cli.plot_cosmo_basins:main"
lsdviz3-chi = "lsdviztools3.cli.plot_chi:main"
lsdviz3-chi-cosmo = "lsdviztools3.cli.plot_chi_cosmo:main"
lsdviz3-basemap = "lsdviztools3.cli.plot_basemap:main"
lsdviz3-sti = "lsdviztools3.cli.plot_sti:main"
lsdviz3-animate = "lsdviztools3.cli.plot_animation:main"
lsdviz3-lem-pulse = "lsdviztools3.cli.plot_lem_pulse:main"
lsdviz3-lem-ci = "lsdviztools3.cli.plot_lem_ci_animation:main"
lsdviz3-cosmo-compare = "lsdviztools3.cli.plot_cosmo_compare:main"
lsdviz3-cosmo-published = "lsdviztools3.cli.plot_cosmo_published:main"
lsdviz3-cosmo-transient = "lsdviztools3.cli.plot_cosmo_transient:main"
lsdviz3-grabdem = "lsdviztools3.cli.grab_dem:main"
lsdviz3-hilltop-coupling = "lsdviztools3.cli.plot_hilltop_coupling:main"
lsdviz3-estar-rstar = "lsdviztools3.cli.plot_estar_rstar:main"
lsdviz3-lsdtt = "lsdviztools3.cli.run_lsdtt:main"
lsdviz3-hillslope-comparison = "lsdviztools3.cli.plot_hillslope_comparison:main"
lsdviz3-ladder-windows = "lsdviztools3.cli.plot_ladder_windows:main"
lsdviz3-ladder-density = "lsdviztools3.cli.plot_ladder_density:main"
lsdviz3-valley-sections = "lsdviztools3.cli.plot_valley_sections:main"
lsdviz3-valley-section-map = "lsdviztools3.cli.plot_valley_section_map:main"
lsdviz3-valley-widths = "lsdviztools3.cli.plot_valley_widths:main"
lsdviz3-perimeter-sources = "lsdviztools3.cli.plot_perimeter_sources:main"
lsdviz3-ladder-bands = "lsdviztools3.cli.plot_ladder_band_map:main"
lsdviz3-lithology-map = "lsdviztools3.cli.plot_lithology_map:main"
lsdviz3-burned-profiles = "lsdviztools3.cli.plot_burned_profiles:main"
lsdviz3-knickpoints = "lsdviztools3.cli.plot_knickpoints:main"
lsdviz3-channel-slopes = "lsdviztools3.cli.plot_channel_slopes:main"
lsdviz3-ksn-by-lithology = "lsdviztools3.cli.plot_ksn_by_lithology:main"
lsdviz3-channel-bearings = "lsdviztools3.cli.plot_channel_bearings:main"
lsdviz3-erodibility-calibration = "lsdviztools3.cli.plot_erodibility_calibration:main"
lsdviz3-ridgeline-curvature = "lsdviztools3.cli.plot_ridgeline_curvature:main"
lsdviz3-ridgeline-summary = "lsdviztools3.cli.plot_ridgeline_summary:main"
lsdviz3-ridgeline-spacing = "lsdviztools3.cli.plot_ridgeline_spacing:main"
lsdviz3-mdd-ridgeline = "lsdviztools3.cli.plot_mdd_ridgeline:main"
lsdviz3-floodplain = "lsdviztools3.cli.plot_floodplain:main"
lsdviz3-surface-methods = "lsdviztools3.cli.plot_surface_methods:main"

[tool.hatch.build.targets.wheel]
packages = ["lsdviztools3"]
