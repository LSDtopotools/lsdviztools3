site_name: lsdviztools3
site_description: PyGMT-based visualisation tools for LSDTopoTools v3 (lsdtt3) output.
site_url: https://lsdtopotools.github.io/lsdviztools3/
repo_url: https://github.com/LSDtopotools/lsdviztools3
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Plots:
      - Basic plots: basic_plots.md
      - Chi analysis: chi_analysis.md
      - Channel networks: channel_networks.md
      - Lithology: lithology.md
      - Valleys and cross sections: valleys_and_cross_sections.md
      - Hillslopes and ridgelines: hillslopes_and_ridgelines.md
      - Landscape evolution: landscape_evolution.md
      - Cosmogenic nuclides: cosmogenic_nuclides.md
      - Spectral analysis: spectral_analysis.md
  - Reference:
      - Command reference: cli_reference.md
      - lsdtt3 outputs: lsdtt3_outputs.md
  - Design (developers): design.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:docs._slugify.github_slugify
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

exclude_docs: |
  _slugify.py
  __pycache__/
