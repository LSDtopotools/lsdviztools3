name: Build and release

# Builds the wheel and sdist for a version tag, attaches them to a GitHub
# Release, and publishes them to PyPI.
#
# Triggers:
#   - push of a version tag:
#       git tag -a v0.3.0 -m "lsdviztools3 0.3.0" && git push origin v0.3.0
#     -> GitHub Release + PyPI
#   - manual run from the Actions tab, naming an EXISTING tag, with
#     publish_to:
#       none     -> GitHub Release only (a tag pushed before this workflow
#                   existed, or to redo a failed run)
#       testpypi -> TestPyPI only, for a trial upload; the GitHub Release is
#                   not touched
#       pypi     -> GitHub Release + PyPI (to redo a failed PyPI upload)
#
# Publishing uses PyPI trusted publishing (OpenID Connect): no token is stored
# in the repository. It needs, once, on pypi.org and test.pypi.org, a trusted
# publisher for owner LSDtopotools, repository lsdviztools3, workflow
# release.yml and environment pypi (on test.pypi.org: testpypi), and the
# GitHub environments pypi and testpypi in the repository settings. Before the
# first upload the project does not exist yet, so add it as a "pending"
# publisher. A version can be uploaded only once (skip-existing makes a re-run
# harmless), so a mistake needs a new version.
#
# The tag must match the version in pyproject.toml and __version__ in
# lsdviztools3/__init__.py (tag v0.3.0 <-> version 0.3.0); the run fails
# before building anything if they differ. lsdviztools3 is pure Python, so
# one py3-none-any wheel serves every platform.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.2.0)
        required: true
      publish_to:
        description: Where to publish the packages (none = GitHub Release only)
        type: choice
        options:
          - none
          - testpypi
          - pypi
        default: none

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+([.-]?(a|b|rc|post|dev)\d+)?", tag):
              sys.exit(f"tag {tag!r} is not a version tag like v0.3.0")
          with open("pyproject.toml", "rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          init = open("lsdviztools3/__init__.py", encoding="utf-8").read()
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M)
          init_version = match.group(1) if match else None
          print(f"tag {tag}, pyproject.toml {project_version}, __init__.py {init_version}")
          if tag[1:] != project_version or project_version != init_version:
              sys.exit("tag, pyproject.toml and __init__.py versions must all agree")
          PY

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .
          ls -l dist

      - name: Check the wheel installs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet --no-deps dist/*.whl
          /tmp/check/bin/python -c "import importlib.metadata as m; print('installed', m.version('lsdviztools3'))"

      - name: Keep the packages for the publishing jobs
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 14

      - name: Create the GitHub Release
        if: github.event.inputs.publish_to != 'testpypi'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: lsdviztools3 ${{ env.TAG }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: github.event_name == 'push' || github.event.inputs.publish_to == 'pypi'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/lsdviztools3/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: release
    if: github.event.inputs.publish_to == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lsdviztools3/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
